name: Build Mac Desktop App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Desktop App
        run: |
          npm install
          npm run build
          mkdir -p src-tauri/src-tauri/dist
          cp -r .output/public/* src-tauri/src-tauri/dist/
          cp src-tauri/src-tauri/dist/200.html src-tauri/src-tauri/dist/index.html || true
          RUSTFLAGS="-C linker=clang" npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Asfalis-Installer
          path: "**/target/release/bundle/macos/*"

